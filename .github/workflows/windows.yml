name: Windows

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Validate companion extension
        run: |
          node --check extension/canonical.js
          node --check extension/operations.js
          node --check extension/project.js
          node --check extension/auth.js
          node --check extension/page-executor.js
          node --check extension/page-tab.js
          node --check extension/background.js
          node --check extension/popup.js
          node --check extension/validate-manifest.js
          node extension/validate-manifest.js
          node extension/sanitize.js --self-test
          node extension/test-companion.js

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build ProMeter.sln -c Release

      - name: Test
        run: dotnet test ProMeter.sln -c Release --no-build

      - name: Publish win-x64
        run: >
          dotnet publish src/ProMeter/ProMeter.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish/win-x64

      - name: Assert published artifacts
        run: |
          if (!(Test-Path publish/win-x64/prometer.exe)) { throw "prometer.exe missing" }
          if (!(Test-Path publish/win-x64/prometer-companion-host.exe)) { throw "prometer-companion-host.exe missing" }
          if (!(Test-Path publish/win-x64/extension/manifest.json)) { throw "extension/manifest.json missing" }
          if (!(Test-Path publish/win-x64/extension/background.js)) { throw "extension/background.js missing" }
          if (!(Test-Path publish/win-x64/extension/page-executor.js)) { throw "extension/page-executor.js missing" }
          if (!(Test-Path publish/win-x64/extension/page-tab.js)) { throw "extension/page-tab.js missing" }

      - name: Upload published folder
        uses: actions/upload-artifact@v4
        with:
          name: prometer-win-x64
          path: publish/win-x64
