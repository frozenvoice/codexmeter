name: Windows

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build CodexMeter.sln -c Release

      - name: Test
        run: dotnet test CodexMeter.sln -c Release --no-build

      - name: Validate desktop resources
        run: dotnet run --project tests/CodexMeter.UiSmoke/CodexMeter.UiSmoke.csproj -c Release --no-build

      - name: Installer recovery tests
        run: ./tests/LocalInstall.Tests.ps1

      - name: Publish win-x64
        run: >
          dotnet publish src/CodexMeter/CodexMeter.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=None
          -p:DebugSymbols=false
          -o publish/win-x64

      - name: Assert single-file artifact
        run: |
          if (!(Test-Path publish/win-x64/CycleArc.exe)) { throw "CycleArc.exe missing" }
          if (@(Get-ChildItem publish/win-x64 -File -Recurse).Count -ne 1) { throw "Unexpected companion files" }

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: CycleArc-win-x64
          path: publish/win-x64/CycleArc.exe
