name: Windows

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Validate companion extension
        run: |
          node --check extension/canonical.js
          node --check extension/operations.js
          node --check extension/project.js
          node --check extension/auth.js
          node --check extension/page-executor.js
          node --check extension/page-tab.js
          node --check extension/companion-reconnect.js
          node --check extension/background.js
          node --check extension/popup.js
          node --check extension/validate-manifest.js
          node extension/validate-manifest.js
          node extension/sanitize.js --self-test
          node extension/test-companion.js

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build ProMeter.sln -c Release

      - name: Test
        run: dotnet test ProMeter.sln -c Release --no-build

      - name: Publish win-x64
        run: >
          dotnet publish src/ProMeter/ProMeter.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=None
          -p:DebugSymbols=false
          -o publish/win-x64

      - name: Assert single-file artifact
        run: |
          if (!(Test-Path publish/win-x64/CodexMeter.exe)) { throw "CodexMeter.exe missing" }
          if (@(Get-ChildItem publish/win-x64 -File -Recurse).Count -ne 1) { throw "Unexpected companion files" }

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: CodexMeter-win-x64
          path: publish/win-x64/CodexMeter.exe
